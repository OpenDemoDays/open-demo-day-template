<script>
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'es';document.documentElement.lang=lang;
const t={es:{start:'Inicio y preparación',prep:'Antes del workshop',base:'Fundamentos',net:'Redes y almacenamiento',main:'KubeVirt: conceptos y operación',lab:'Ejercicio guiado: VM funcional',ops:'Operación y siguientes pasos',materials:'Materiales',previous:'Anterior',next:'Siguiente',toc:'En esta página',search:'Buscar en el workshop',presentation:'Presentación',material:'Material',repo:'Repositorio',home:'Inicio',skip:'Saltar al contenido'},en:{start:'Start and preparation',prep:'Before the workshop',base:'Foundations',net:'Networking and storage',main:'KubeVirt: concepts and operations',lab:'Guided lab: functional VM',ops:'Operations and next steps',materials:'Materials',previous:'Previous',next:'Next',toc:'On this page',search:'Search the workshop',presentation:'Presentation',material:'Materials',repo:'Repository',home:'Home',skip:'Skip to content'}}[lang];

const steps=[
{id:'start',title:t.start,group:lang==='es'?'Inicio':'Start',summary:lang==='es'?'Objetivos, agenda y resultado práctico.':'Goals, agenda, and practical outcome.',html:'<section class="hero"><div class="hero-copy"><div class="eyebrow">Open-Industries × OpenDemoDays</div><h1>CHANGEME_WORKSHOP_TITLE</h1><p>CHANGEME: describe el propósito, la audiencia y lo que construirán los participantes.</p></div><svg viewBox="0 0 520 330" role="img" aria-label="Ilustración de ejemplo del workshop; reemplazar o adaptar"><rect x="35" y="24" width="450" height="280" rx="18" fill="#17263c" stroke="#8ba9d3" stroke-width="3"/><rect x="60" y="52" width="400" height="38" rx="8" fill="#263b59"/><g fill="#2459a6" stroke="#8fb7f0" stroke-width="4"><rect x="75" y="122" width="110" height="78" rx="10"/><rect x="205" y="122" width="110" height="78" rx="10"/><rect x="335" y="122" width="110" height="78" rx="10"/></g><g fill="#eaf2ff"><circle cx="130" cy="150" r="10"/><circle cx="260" cy="150" r="10"/><circle cx="390" cy="150" r="10"/></g><path d="M130 201v34h260v-34M260 201v34" fill="none" stroke="#9fb5d2" stroke-width="4"/><rect x="155" y="252" width="210" height="24" rx="8" fill="#0f172a" stroke="#70d5c4" stroke-width="2"/><text x="260" y="269" fill="#dbeafe" text-anchor="middle" font-size="13">CHANGEME · VISUAL</text></svg></section><h2>'+(lang==='es'?'Resultado del workshop':'Workshop outcome')+'</h2><p>'+(lang==='es'?'Al finalizar, cada participante podrá completar un flujo práctico de principio a fin y verificar el resultado. Define aquí un objetivo observable.':'By the end, participants will complete a practical end-to-end workflow and verify the result. Define an observable outcome here.')+'</p><h2>'+(lang==='es'?'Recorrido de aprendizaje':'Learning path')+'</h2><div class="cards">'+cards.map((s,i)=>'<a class="card" href="#'+s.id+'"><b>0'+(i+1)+' · '+s.group+'</b><strong>'+s.title+'</strong><span>'+s.summary+'</span></a>').join('')+'</div><h2>'+(lang==='es'?'Antes de comenzar':'Before you start')+'</h2><ul><li>'+ (lang==='es'?'Confirma acceso al entorno y herramientas requeridas.':'Confirm access to the environment and required tools.')+'</li><li>'+ (lang==='es'?'Revisa prerrequisitos, versiones y materiales.':'Review prerequisites, versions, and materials.')+'</li></ul>'},
{id:'prep',title:t.prep,group:lang==='es'?'Preparación':'Preparation',summary:lang==='es'?'Audiencia, objetivos, accesos y requisitos.':'Audience, goals, access, and requirements.',html:'<h2>CHANGEME: Perfil de participantes</h2><p>Indica la experiencia previa, permisos y herramientas necesarias.</p><h2>Objetivos de aprendizaje</h2><ul><li>Explicar los componentes del flujo de trabajo.</li><li>Ejecutar los pasos en un entorno preparado.</li><li>Validar el resultado y solucionar fallas comunes.</li></ul><h2>Lista de preparación</h2><p>Incluye aquí el cluster, namespace, enlaces de acceso, versiones y responsables.</p>'},
{id:'base',title:t.base,group:lang==='es'?'Día 1 · Fundamentos':'Day 1 · Foundations',summary:lang==='es'?'Contexto de Kubernetes y modelo de ejecución.':'Kubernetes context and execution model.',html:'<h2>Conceptos clave</h2><p>Presenta el modelo mental antes de abrir los laboratorios.</p><ul><li>Imágenes OCI, contenedores y ciclo de vida.</li><li>API de Kubernetes, Pods, Deployments y Services.</li><li>Declaraciones YAML y reconciliación del estado deseado.</li></ul><h2>Demostración</h2><pre><code>kubectl get nodes -o wide<br>kubectl get pods,deployments,services -A</code></pre><div class="callout"><b>CHANGEME:</b> agrega el punto de verificación y la salida esperada.</div>'},
{id:'net',title:t.net,group:lang==='es'?'Día 1 · Fundamentos':'Day 1 · Foundations',summary:lang==='es'?'Dependencias de conectividad y persistencia.':'Connectivity and persistence dependencies.',html:'<h2>Redes</h2><p>Documenta los endpoints, Services, políticas y rutas que necesita el ejercicio.</p><h2>Almacenamiento</h2><p>Describe StorageClass, PVC, capacidad, modos de acceso y limpieza del laboratorio.</p><h2>Verificación</h2><ol><li>Identifica origen y destino del tráfico.</li><li>Comprueba endpoints, permisos y conectividad.</li><li>Valida persistencia y disponibilidad del almacenamiento.</li></ol>'},
{id:'main',title:t.main,group:lang==='es'?'Día 2 · Virtualización':'Day 2 · Virtualization',summary:lang==='es'?'VM/VMI, discos, ciclo de vida y plataforma.':'VM/VMI, disks, lifecycle, and platform.',html:'<h2>Arquitectura</h2><p>Usa esta sección para explicar los componentes y decisiones de la plataforma. Para el ejemplo KubeVirt, cubre VM/VMI, CDI, virt-api, virt-controller y virt-handler.</p><h2>Despliegue y ciclo de vida</h2><p>Demuestra la creación, inicio, acceso a consola, inspección y detención de la VM.</p><pre><code>kubectl get vm,vmi -A<br>kubectl describe vm CHANGEME<br>virtctl start CHANGEME</code></pre><h2>Diagrama</h2><div class="diagram"><svg class="content-image" viewBox="0 0 900 180" role="img" aria-label="Diagrama de flujo de ejemplo"><rect x="15" y="20" width="250" height="140" rx="12" fill="#eef4ff" stroke="#2459a6" stroke-width="3"/><rect x="325" y="20" width="250" height="140" rx="12" fill="#effaf8" stroke="#0f8b79" stroke-width="3"/><rect x="635" y="20" width="250" height="140" rx="12" fill="#fff7ed" stroke="#c65d11" stroke-width="3"/><g font-family="Arial" text-anchor="middle" font-size="20" fill="#17263c"><text x="140" y="100">SOURCE</text><text x="450" y="100">PLATFORM</text><text x="760" y="100">OUTCOME</text></g><path d="M265 90h60m-12-10 12 10-12 10m250-10h60m-12-10 12 10-12 10" fill="none" stroke="#64748b" stroke-width="4"/></svg></div>'},
{id:'lab',title:t.lab,group:lang==='es'?'Día 2 · Práctica':'Day 2 · Practice',summary:lang==='es'?'Construye, valida y limpia el entorno.':'Build, verify, and clean up the environment.',html:'<h2>Pasos del laboratorio</h2><ol><li>Prepara el proyecto o namespace.</li><li>Aplica los manifiestos revisados.</li><li>Espera el estado listo y revisa eventos.</li><li>Prueba el servicio desde la perspectiva del usuario.</li><li>Limpia recursos temporales.</li></ol><h2>Criterios de salida</h2><ul><li>La VM Linux inicia con almacenamiento persistente.</li><li>Un servidor HTTP responde por el Service.</li><li>Los participantes pueden repetir el flujo con la guía.</li></ul>'},
{id:'ops',title:t.ops,group:lang==='es'?'Cierre':'Wrap-up',summary:lang==='es'?'Diagnóstico, seguridad y próximos pasos.':'Troubleshooting, security, and follow-up.',html:'<h2>Diagnóstico inicial</h2><ul><li>Revisa estado, eventos y logs.</li><li>Confirma permisos, capacidad y dependencias.</li><li>Compara el estado aplicado con el esperado.</li></ul><h2>Cierre</h2><p>Recapitula los objetivos, comparte materiales y acuerda próximos pasos.</p>'},
{id:'materials',title:t.materials,group:lang==='es'?'Recursos':'Resources',summary:lang==='es'?'Presentación, guías y repositorio.':'Presentation, guides, and repository.',html:'<h2>Enlaces</h2><ul><li><a href="CHANGEME_PRESENTATION_URL">'+t.presentation+'</a></li><li><a href="CHANGEME_MATERIALS_URL">'+t.material+'</a></li><li><a href="CHANGEME_REPOSITORY_URL">'+t.repo+'</a></li><li><a href="https://kubevirt.io/user-guide/">KubeVirt User Guide</a></li></ul><h2>Material descargable</h2><p>Agrega manifiestos, diagramas, datasets y guías del instructor.</p>'}
];
let current='start';function render(id){let i=Math.max(0,steps.findIndex(s=>s.id===id));let s=steps[i];current=s.id;document.title=s.title+' | CHANGEME_WORKSHOP_TITLE';document.querySelector('#breadcrumb').textContent=s.title;document.querySelector('#content').innerHTML=(i?'<h1>'+s.title+'</h1><p>'+s.group+' · '+s.summary+'</p>':'')+s.html+'<nav class="pager" aria-label="'+(lang==='es'?'Navegación del workshop':'Workshop navigation')+'">'+(i?'<a href="#'+steps[i-1].id+'">← '+t.previous+': '+steps[i-1].title+'</a>':'')+(i<steps.length-1?'<a href="#'+steps[i+1].id+'">'+t.next+': '+steps[i+1].title+' →</a>':'')+'</nav>';document.querySelector('#nav').innerHTML=steps.map(x=>'<a class="'+(x.id===current?'active':'')+'" href="#'+x.id+'" data-id="'+x.id+'">'+x.title+'</a>').join('');let hs=[...document.querySelectorAll('#content h2')];document.querySelector('#toc').innerHTML='<b>'+t.toc+'</b>'+hs.map((h,n)=>{let id='h'+n;h.id=id;return '<a href="#'+id+'">'+h.textContent+'</a>'}).join('');if(innerWidth<801){document.querySelector('#side').classList.remove('open');document.querySelector('#toggle').setAttribute('aria-expanded','false')}if(location.hash!=='#'+s.id)history.replaceState(null,'','#'+s.id)}
document.querySelector('#nav').addEventListener('click',e=>{let a=e.target.closest('[data-id]');if(a){e.preventDefault();render(a.dataset.id)}});document.querySelector('#content').addEventListener('click',e=>{let a=e.target.closest('a[href^="#"]');if(a){let id=a.getAttribute('href').slice(1);if(steps.some(s=>s.id===id)){e.preventDefault();render(id)}}});document.querySelector('#search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('#nav a').forEach(a=>a.hidden=!a.textContent.toLowerCase().includes(q))});document.querySelector('#toggle').addEventListener('click',()=>{let o=document.querySelector('#side').classList.toggle('open');document.querySelector('#toggle').setAttribute('aria-expanded',String(o))});document.querySelector('#language').textContent=lang==='es'?'EN':'ES';document.querySelector('#language').href='index.html?lang='+(lang==='es'?'en':'es');document.querySelector('#skip').textContent=t.skip;document.querySelector('#search-label').textContent=t.search;document.querySelector('#search').placeholder=lang==='es'?'Buscar…':'Search…';document.querySelector('#toggle').setAttribute('aria-label',lang==='es'?'Abrir índice':'Open index');document.querySelector('.home').setAttribute('aria-label',t.home);document.querySelector('.actions [data-key="presentation"]').textContent=t.presentation;document.querySelector('.actions [data-key="materials"]').textContent=t.material;document.querySelector('.actions [data-key="repo"]').textContent=t.repo;document.querySelector('#footer').innerHTML=lang==='es'?'Open-Industries en colaboración con OpenDemoDays · <a href="CHANGEME_REPOSITORY_URL">Repositorio del workshop</a>':'Open-Industries in collaboration with OpenDemoDays · <a href="CHANGEME_REPOSITORY_URL">Workshop repository</a>';render('start');
</script></body></html>
